[project]
name = "kvcache-bench"
version = "0.1.0"
description = "Energy-aware, apples-to-apples benchmark of KV cache compression methods"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "torch>=2.3.1,<3",
    "transformers>=4.56,<5.3",
    "accelerate>=1.0",
    "datasets>=2.21",
    "kvpress>=0.5.4",
    # Pulled in by the vendored LongBench scorer (see benchmarks/vendored/).
    "rouge>=1.0.1,<2",
    "fuzzywuzzy>=0.18",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
# Only installable where an NVIDIA driver exists. Deliberately excluded from the
# default install so the macOS dev path exercises the fake hardware backend.
gpu = ["nvidia-ml-py>=12.535"]

[project.scripts]
kvbench = "kvbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvbench"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults.
"src/kvbench/cli.py" = ["B008"]
# Vendored verbatim from NVIDIA/kvpress; keep it byte-identical to upstream.
"src/kvbench/benchmarks/vendored/*" = ["ALL"]

[tool.ruff.format]
# Never reformat the vendored scorers; they must stay identical to upstream.
exclude = ["src/kvbench/benchmarks/vendored/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
