# The headline sweep. Every number in the report comes from one execution of
# this config on one card -- energy and latency are not comparable across
# hardware, so a second card means a second table, never a merged one.
#
# The GPU is not chosen yet, so nothing here names one. Run
#   kvbench plan configs/full_sweep.yaml --hourly-usd <price>
# and size the card and the sweep against that number before renting.
name: full_sweep

model:
  id: meta-llama/Llama-3.1-8B-Instruct
  dtype: bfloat16
  attn_implementation: flash_attention_2

runtime:
  device: cuda
  hardware_backend: nvml
  # Two slots: H2O needs eager attention while everything else uses flash, and
  # with shuffled ordering one slot means reloading the model dozens of times.
  # Costs ~16 GB VRAM; drop to 1 on a 24 GB card.
  max_resident_models: 2
  power_sample_hz: 10
  warmup: true
  # Runs are shuffled under this seed so thermal drift over a long session does
  # not line up with method order.
  shuffle_seed: 1234
  lock_clocks_mhz: null

generation:
  max_new_tokens: 128
  samples_per_task: 50
  max_context_tokens: 32768

methods:
  - name: full_cache
    kind: full_cache
  - name: streaming_llm
  - name: h2o
    # ObservedAttentionPress forces eager attention, which materialises a
    # [heads, q, k] tensor: ~17 GB at 16k and ~69 GB at 32k for an 8B model.
    # It is excluded above this ceiling rather than run on shortened prompts,
    # which would make its scores incomparable to every other method.
    max_context_tokens: 16384
  - name: snapkv
  - name: pyramidkv
  - name: tova
  - name: kv_quant
    kind: quantization

budgets: [0.5, 0.25, 0.1]
quant_bits: [4, 2]

benchmarks:
  # Single-doc QA, multi-doc QA and summarisation.
  - suite: longbench
    tasks: [narrativeqa, qasper, hotpotqa, 2wikimqa, gov_report, triviaqa]
  # Retrieval is where eviction methods break down most sharply.
  - suite: ruler
    tasks: [niah_single_1, niah_multikey_1]
    context_lengths: [4096, 16384, 32768]

repeats: 1

estimate:
  hourly_usd: 0.40
